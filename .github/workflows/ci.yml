name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: python · lint + type + test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ollive
          POSTGRES_PASSWORD: ollive
          POSTGRES_DB: ollivelogs
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ollive"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      clickhouse:
        image: clickhouse/clickhouse-server:24
        ports: ["8123:8123"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install ruff + mypy + pytest
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy pytest pytest-asyncio pytest-cov httpx pydantic

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: mypy
        run: |
          if [ -d apps/chat-api ] && find apps -name "*.py" -print -quit | grep -q .; then \
            mypy apps packages workers; \
          else \
            echo "No Python sources yet — skipping mypy"; \
          fi

      - name: pytest
        env:
          DATABASE_URL: postgresql+asyncpg://ollive:ollive@localhost:5432/ollivelogs
          REDIS_URL: redis://localhost:6379/0
          CLICKHOUSE_HOST: localhost
        run: |
          if find tests -name "test_*.py" -print -quit | grep -q .; then \
            pytest --cov=apps --cov=packages --cov=workers --cov-report=term; \
          else \
            echo "No Python tests yet — skipping pytest"; \
          fi

  node:
    name: node · lint + type + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install
        run: npm ci --ignore-scripts || npm install --ignore-scripts

      - name: Lint
        run: npm run lint --if-present

      - name: Typecheck
        run: npm run typecheck --if-present

      - name: Test
        run: npm test --if-present

  secret-scan:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
