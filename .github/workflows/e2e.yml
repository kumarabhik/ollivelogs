name: e2e + coverage

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    name: playwright e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install
        run: npm ci --ignore-scripts || npm install --ignore-scripts

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Build web
        run: npm -w apps/web run build

      - name: Run e2e (headless chromium)
        env:
          CI: "true"
        run: npm -w tests/e2e run test --if-present

      - name: Upload playwright-report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            tests/e2e/playwright-report
            tests/e2e/test-results
          retention-days: 7
          if-no-files-found: ignore

  coverage:
    name: coverage gate (≥70%)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ollive
          POSTGRES_PASSWORD: ollive
          POSTGRES_DB: ollivelogs
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ollive"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio pytest-cov asyncpg httpx pydantic pydantic-settings redis prometheus-client

      - name: Pytest with coverage
        env:
          DATABASE_URL: postgresql://ollive:ollive@localhost:5432/ollivelogs
          REDIS_URL: redis://localhost:6379/0
        run: |
          if find tests -name "test_*.py" -print -quit | grep -q .; then
            pytest \
              --cov=apps --cov=packages --cov=workers \
              --cov-report=term --cov-report=xml \
              --cov-fail-under=70 \
              -m "not integration"
          else
            echo "No tests yet — coverage gate skipped"
          fi

      - name: Upload coverage XML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore
