# OpenTelemetry Collector — receives OTLP from chat-api / ingest-api / log-consumer,
# forwards traces to Loki (via logs pipeline) and metrics to Prometheus scrape.
# Lightweight contrib build assumed.

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    send_batch_size: 1024
    timeout: 5s
  memory_limiter:
    check_interval: 1s
    limit_percentage: 80
    spike_limit_percentage: 25
  resource:
    attributes:
      - key: cluster
        value: ollivelogs-local
        action: upsert

exporters:
  # Send traces to stdout for local dev visibility.
  debug:
    verbosity: basic
    sampling_initial: 5
    sampling_thereafter: 50
  # Expose collected metrics on /metrics for Prometheus to scrape.
  prometheus:
    endpoint: 0.0.0.0:8889
    namespace: ollivelogs
  # Push logs to Loki.
  otlphttp/loki:
    endpoint: http://loki:3100/otlp

service:
  telemetry:
    logs:
      level: info
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [debug]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [prometheus]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [otlphttp/loki, debug]
